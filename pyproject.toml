[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgraphportfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "black>=26.5.1",
    "dcor>=0.7",
    "duckdb>=1.6.0.dev343",
    "framecache",
    "graspologic",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "multilayer-netviz",
    "networkx>=3.6.1",
    "numba>=0.66",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0rc0",
    "plotnine>=0.15.7",
    "polars>=1.43.2",
    "py3plex",
    "pyarrow>=25.0.1",
    "pyside6>=6.8",
    "python-dotenv>=1.1.0",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.0",
]

# ace_cream compiles a Fortran extension (meson-python + gfortran) and is kept
# optional so a missing toolchain never blocks `uv sync`/app startup -- without
# it, the GUI detects the failed import and hides the "Maximal correlation
# (ACE)" measure instead of failing to install. Enable with: uv sync --extra ace
[project.optional-dependencies]
ace = ["ace_cream"]

[project.scripts]
tgraph-gui = "tgraphportfolio.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tgraphportfolio"]

[tool.uv]
package = true
prerelease = "allow"

[tool.uv.sources]
ace_cream = { git = "https://github.com/FulgentMcGuffin/ace_cream.git" }
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
graspologic = { git = "https://github.com/FulgentMcGuffin/graspologic.git" }
py3plex = { git = "https://github.com/SkBlaz/py3plex.git" }
multilayer-netviz = { git = "https://github.com/FulgentMcGuffin/MultiLayerNetViz.git" }
