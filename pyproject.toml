[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgraphportfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dcor>=0.7",
    "duckdb>=1.6.0.dev343",
    "framecache",
    "graspologic>=3.4,<4",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "networkx>=3.6.1",
    "numba>=0.66",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotnine>=0.15.7",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pyside6>=6.8",
    "python-dotenv>=1.1.0",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.0",
]

[project.scripts]
tgraph-gui = "tgraphportfolio.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tgraphportfolio"]

[tool.uv]
package = true
prerelease = "allow"

[tool.uv.sources]
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
